name: Deploy Python Workers (③ EC2)

# BE/FE 와 동일한 OIDC 키리스 패턴.
#   러너가 GitHub Secrets/Variables 로 .env 조립 → S3(SSE) → SSM → compose.
# ⚠️ PUBLIC 레포다. 계정ID·ARN·버킷명을 여기 박지 않는다 — 전부 vars/secrets 로 뺐다.
#   (CHROMA_HOST/PORT 는 토폴로지 상수라 compose 에 직접 있음 — .env 조립 대상 아님)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-python-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPO: team05/python                      # 기존 team05 ECR repo 재사용
  S3_PREFIX: ${{ vars.S3_DEPLOY_PREFIX }}      # 예: s3://<bucket>/vitamins/python/
  EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG }}       # 예: team05-01-python

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write             # OIDC 토큰 발급(키리스 핵심)
      contents: read
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: 이미지 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO:$TAG" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"
          docker push "$REGISTRY/$ECR_REPO:latest"

      - name: .env 조립 (GitHub Secrets/Variables → 파일, 값은 로그 마스킹)
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}        # 커밋별 태그 고정 → 롤백/재현 가능(:latest 이동성 회피)
          APP_ENV: prod
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
          SPRING_BASE_URL: ${{ vars.SPRING_BASE_URL }}
          VITAMATE_WORKER_TOKEN: ${{ secrets.VITAMATE_WORKER_TOKEN }}
          BIDDING_WORKER_TOKEN: ${{ secrets.BIDDING_WORKER_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set -euo pipefail
          umask 077
          # ── 필수 값 가드 ── 누락 시 워커가 조용히 localhost 기본값으로 떨어져 아무 일도 안 함 → 배포를 여기서 실패시킨다.
          missing=""
          for k in GEMINI_API_KEY SPRING_BASE_URL VITAMATE_WORKER_TOKEN REDIS_URL; do
            [ -z "${!k:-}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "❌ 필수 GitHub Secret/Variable 누락:$missing"
            echo "   → 레포 Settings → Secrets and variables → Actions 에 등록 후 재실행."
            exit 1
          fi
          : > deploy.env
          # 빈 값은 건너뜀 → 앱 기본값 유지
          for k in ECR_REGISTRY IMAGE_TAG APP_ENV LOG_LEVEL \
                   GEMINI_API_KEY GEMINI_MODEL GEMINI_EMBEDDING_MODEL \
                   SPRING_BASE_URL VITAMATE_WORKER_TOKEN BIDDING_WORKER_TOKEN \
                   REDIS_URL; do
            v="${!k:-}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> deploy.env
          done

      - name: 배포자산 + .env S3 업로드 (SSE)
        run: |
          set -euo pipefail
          aws s3 sync deploy/ "$S3_PREFIX" --exclude '.env.example'
          aws s3 cp deploy.env "${S3_PREFIX}.env" --sse AES256

      - name: ③ EC2에서 받아 기동 (SSM send-command — 시크릿 없음)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          echo "대상 인스턴스: $INSTANCE_ID"
          if [ -z "$INSTANCE_ID" ]; then echo "running 인스턴스 없음"; exit 1; fi

          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "ts() { TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST'; }",
            "export ECR_REGISTRY=$REGISTRY",
            "echo \"[\$(ts)] === 배포 시작 (Python) ===\"",
            "mkdir -p /opt/python",
            "aws s3 sync $S3_PREFIX /opt/python --delete --exclude '.env'",
            "aws s3 cp ${S3_PREFIX}.env /opt/python/.env",
            "cd /opt/python",
            "chmod 600 .env",
            "[ \"\$(stat -c '%a' .env)\" = \"600\" ] || { echo \"[\$(ts)] FAIL: .env 권한 600 아님\"; exit 1; }",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "docker compose pull",
            "docker compose up -d --remove-orphans",
            "echo \"[\$(ts)] 기동 확인: localhost:8000/health 대기...\"",
            "for i in \$(seq 1 40); do code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true); [ \"\$code\" = \"200\" ] && { echo \"[\$(ts)] OK: health 200\"; break; }; [ \$i -eq 40 ] && { echo \"[\$(ts)] FAIL: 200초 후에도 무응답(\$code)\"; docker compose logs --tail 80; exit 1; }; sleep 5; done",
            "for c in \$(docker ps -aq --filter 'label=com.docker.compose.project=vitamins-python'); do echo \"\$c \$(docker inspect -f '{{.RestartCount}}' \$c)\"; done > /tmp/vits_rc_base",
            "sleep 15",
            "while read c base; do cur=\$(docker inspect -f '{{.RestartCount}}' \$c 2>/dev/null || echo \$base); if [ \"\$cur\" -gt \"\$base\" ]; then nm=\$(docker inspect -f '{{.Name}}' \$c); echo \"[\$(ts)] FAIL: \$nm 안정화 구간 재시작 \$base→\$cur\"; docker logs --tail 40 \$c; exit 1; fi; done < /tmp/vits_rc_base",
            "echo \"[\$(ts)] OK: 안정화 구간 내 재시작 없음\"",
            "docker image prune -f",
            "echo \"[\$(ts)] === 배포 완료 (Python) ===\""
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy vitamins-python ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          # SSM 상태 폴링 — `wait command-executed` 는 ~100초(20회×5s)만에 포기해 InProgress 를 반환할 수 있다.
          #   이미지 pull 이 길면(chromadb+파이썬) 그 사이 아직 InProgress → 아래 검사가 오탐 실패한다.
          #   → 종료 상태가 될 때까지 timeout(600s) 전 구간을 직접 폴링한다.
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "===== EC2 표준 출력 ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "최종 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "===== EC2 표준 에러 ====="
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: S3 시크릿 정리 (at-rest 제거)
        if: always()
        run: aws s3 rm "${S3_PREFIX}.env" || true
